<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphable Chatbot — ModernReader Labs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family:'Inter','Noto Sans TC',sans-serif;
    background:#06060d;
    overflow:hidden;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  #canvas-container {
    flex:1;
    position:relative;
    cursor:grab;
  }
  #canvas-container:active { cursor:grabbing; }

  .mode-toggle {
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:8px;
    z-index:10;
  }

  .mode-btn {
    padding:10px 20px;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    background:rgba(0,0,0,0.5);
    color:#ccc;
    font-family:inherit;
    font-size:0.85rem;
    cursor:pointer;
    transition:all 0.35s ease;
    backdrop-filter:blur(12px);
  }

  .mode-btn.active {
    background:rgba(139,200,120,0.25);
    border-color:rgba(139,200,120,0.6);
    color:#8bc878;
  }

  .mode-btn:nth-child(2).active {
    background:rgba(100,180,255,0.25);
    border-color:rgba(100,180,255,0.6);
    color:#64b4ff;
  }

  .info-overlay {
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    color:rgba(255,255,255,0.6);
    font-size:0.8rem;
    pointer-events:none;
  }

  .chat-panel {
    height:200px;
    background:rgba(10,10,20,0.95);
    border-top:1px solid rgba(255,255,255,0.06);
    display:flex;
    flex-direction:column;
    backdrop-filter:blur(20px);
  }

  .messages {
    flex:1;
    overflow-y:auto;
    padding:12px 24px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .msg {
    padding:8px 14px;
    border-radius:16px;
    max-width:70%;
    font-size:0.85rem;
    line-height:1.5;
    animation:fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }

  .msg.user {
    align-self:flex-end;
    background:rgba(139,200,120,0.15);
    color:#d0e8c0;
    border-bottom-right-radius:4px;
  }

  .msg.bot {
    align-self:flex-start;
    background:rgba(100,140,255,0.08);
    color:#b0c8f0;
    border-bottom-left-radius:4px;
  }

  .input-row {
    display:flex;
    padding:10px 24px 16px;
    gap:10px;
  }

  .input-row input {
    flex:1;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:10px 18px;
    color:#e0e0e0;
    font-family:inherit;
    font-size:0.9rem;
    outline:none;
    transition:border-color 0.3s;
  }

  .input-row input:focus {
    border-color:rgba(139,200,120,0.4);
  }

  .input-row button {
    padding:10px 24px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg, rgba(139,200,120,0.8), rgba(100,180,255,0.6));
    color:#fff;
    font-family:inherit;
    font-size:0.85rem;
    cursor:pointer;
    transition:opacity 0.3s;
  }

  .input-row button:hover { opacity:0.85; }

  .sentiment-bar {
    position:absolute;
    bottom:210px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    z-index:10;
    pointer-events:none;
  }

  .sentiment-dot {
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,0.3);
    transition:all 0.5s ease;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <div class="info-overlay" id="info">Morphable Chatbot — 與我對話，觀察形態變化</div>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="switchMode('tree')">樹木</button>
    <button class="mode-btn" onclick="switchMode('whale')">鯨魚</button>
  </div>
  <div class="sentiment-bar" id="sentiment-bar"></div>
</div>

<div class="chat-panel">
  <div class="messages" id="messages">
    <div class="msg bot">你好，我是 Morphable Chatbot。試著跟我說點什麼——我的形態會根據你的話語而變化。</div>
  </div>
  <div class="input-row">
    <input type="text" id="user-input" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">發送</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- Scene Setup ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.1, 100);
camera.position.set(0, 3, 14);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lighting
const ambient = new THREE.AmbientLight(0x223344, 1.5);
scene.add(ambient);
const keyLight = new THREE.DirectionalLight(0xffeedd, 3);
keyLight.position.set(5, 8, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x6688cc, 1.5);
rimLight.position.set(-3, 2, -5);
scene.add(rimLight);

// Ground plane with subtle grid
const groundGeo = new THREE.PlaneGeometry(30, 30);
const groundMat = new THREE.MeshStandardMaterial({
  color:0x111122,
  roughness:0.9,
  metalness:0.1,
  transparent:true,
  opacity:0.4
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.5;
scene.add(ground);

// Particles background
const particlesGeo = new THREE.BufferGeometry();
const particlesCount = 400;
const posArray = new Float32Array(particlesCount*3);
for(let i=0;i<particlesCount*3;i+=3) {
  posArray[i] = (Math.random()-0.5)*20;
  posArray[i+1] = Math.random()*10-2;
  posArray[i+2] = (Math.random()-0.5)*15-2;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray,3));
const particlesMat = new THREE.PointsMaterial({
  size:0.03,
  color:0x6688cc,
  transparent:true,
  opacity:0.5,
  blending:THREE.AdditiveBlending
});
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// --- State ---
let currentMode = 'tree';
let organismGroup = new THREE.Group();
scene.add(organismGroup);
let leaves = [];
let branches = [];
let whaleParts = {};
let messageCount = 0;

// Sentiment tracking
let sentimentHistory = [];
const maxSentimentDots = 30;

function initSentimentDots() {
  const bar = document.getElementById('sentiment-bar');
  for(let i=0;i<maxSentimentDots;i++) {
    const dot = document.createElement('div');
    dot.className = 'sentiment-dot';
    bar.appendChild(dot);
  }
}

function updateSentimentDots(sentiment) {
  const dots = document.querySelectorAll('.sentiment-dot');
  sentimentHistory.push(sentiment);
  if(sentimentHistory.length > maxSentimentDots) sentimentHistory.shift();

  dots.forEach((dot,i) => {
    if(i < sentimentHistory.length) {
      const s = sentimentHistory[i];
      const hue = s > 0 ? 120 : s < 0 ? 240 : 200;
      const sat = Math.abs(s) * 60 + 20;
      dot.style.background = `hsl(${hue}, ${sat}%, ${Math.abs(s)*30+50}%)`;
      dot.style.transform = `scale(${1+Math.abs(s)*0.5})`;
    } else {
      dot.style.background = 'rgba(255,255,255,0.15)';
      dot.style.transform = 'scale(1)';
    }
  });
}

function simpleSentiment(text) {
  const positive = ['好','棒','讚','喜歡','愛','開心','美','漂亮','厲害','酷','nice','great','love','good','awesome','beautiful','amazing'];
  const negative = ['糟','爛','討厭','恨','難過','無聊','恐怖','怕','差','壞','bad','hate','terrible','awful','boring','ugly','stupid'];
  const t = text.toLowerCase();
  let score = 0;
  positive.forEach(w => { if(t.includes(w)) score += 1; });
  negative.forEach(w => { if(t.includes(w)) score -= 1; });
  return Math.max(-1, Math.min(1, score * 0.5));
}

// --- Tree Organism ---
function createTree() {
  clearOrganism();

  const trunkGeo = new THREE.CylinderGeometry(0.15, 0.25, 3, 12, 4);
  const trunkMat = new THREE.MeshStandardMaterial({
    color: 0x5c3a21,
    roughness: 0.7,
    metalness: 0.1
  });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 0;
  trunk.castShadow = true;
  organismGroup.add(trunk);
  branches.push(trunk);

  // Initial branches
  for(let i=0;i<3;i++) {
    const angle = (i/3)*Math.PI*0.7 - 0.35;
    growBranch(trunk.position.y + 1.2, angle, 0.8, 0.08);
  }
}

function growBranch(startY, angle, length, thickness) {
  const geom = new THREE.CylinderGeometry(thickness, thickness*1.2, length, 8, 4);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.1, 0.4, 0.2 + Math.random()*0.15),
    roughness: 0.6
  });
  const branch = new THREE.Mesh(geom, mat);

  const group = new THREE.Group();
  group.position.set(0, startY, 0);
  group.rotation.z = angle;
  branch.position.y = length/2;
  group.add(branch);
  organismGroup.add(group);

  branches.push(group);
  return { group, branch, length };
}

function growLeaf(branchGroup, branchLength) {
  const size = 0.2 + Math.random()*0.4;
  const leafGeo = new THREE.SphereGeometry(size, 6, 4);
  leafGeo.scale(1, 0.3, 1.2);
  const hue = 0.2 + Math.random()*0.2;
  const leafMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(hue, 0.7, 0.35 + Math.random()*0.2),
    roughness: 0.4,
    transparent: true,
    opacity: 0
  });
  const leaf = new THREE.Mesh(leafGeo, leafMat);

  const worldPos = new THREE.Vector3();
  branchGroup.getWorldPosition(worldPos);
  leaf.position.copy(worldPos);
  leaf.position.y += branchLength;
  leaf.position.x += (Math.random()-0.5)*0.3;
  leaf.position.z += (Math.random()-0.5)*0.3;
  leaf.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);

  leaf.userData = { targetOpacity: 0.85 + Math.random()*0.15, growth: 0 };
  organismGroup.add(leaf);
  leaves.push(leaf);

  // Animate in
  const startScale = 0.01;
  leaf.scale.set(startScale, startScale, startScale);
  leaf.userData.targetScale = 1;
}

function addTreeGrowth() {
  messageCount++;
  const branchIndex = messageCount % branches.length;
  const branch = branches[branchIndex];

  if(branch && branch.userData?.branchLength !== undefined) {
    // Has sub-branch structure — grow a leaf
    growLeaf(branch, branch.userData.branchLength);
  } else if(branches.length < 15) {
    // Grow a new branch
    const angle = (Math.random()-0.5)*1.2;
    const b = growBranch(1.2 + messageCount*0.15, angle, 0.5+Math.random()*0.4, 0.06);
    b.group.userData = { branchLength: b.length };
  }

  // Always add some leaves
  for(let i=0;i<2;i++) {
    if(branches.length > 0) {
      const rb = branches[Math.floor(Math.random()*branches.length)];
      const worldPos = new THREE.Vector3();
      if(rb.getWorldPosition) rb.getWorldPosition(worldPos);
      const leafGeo = new THREE.SphereGeometry(0.15+Math.random()*0.25, 6, 4);
      leafGeo.scale(1, 0.25, 1.1);
      const leafMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.15+Math.random()*0.25, 0.7, 0.35+Math.random()*0.25),
        roughness:0.4, transparent:true, opacity:0
      });
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.set(worldPos.x+(Math.random()-0.5)*0.8, worldPos.y+0.5, worldPos.z+(Math.random()-0.5)*0.8);
      leaf.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
      leaf.userData = { targetOpacity: 0.7+Math.random()*0.3, growth:0 };
      leaf.scale.set(0.01, 0.01, 0.01);
      leaf.userData.targetScale = 1;
      organismGroup.add(leaf);
      leaves.push(leaf);
    }
  }
}

// --- Whale Organism ---
function createWhale() {
  clearOrganism();

  // Ocean floor
  const oceanFloor = new THREE.PlaneGeometry(20, 20);
  const oceanMat = new THREE.MeshStandardMaterial({
    color: 0x0a1a3a,
    roughness: 0.9,
    transparent: true,
    opacity: 0.3
  });
  const floor = new THREE.Mesh(oceanFloor, oceanMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -1.8;
  organismGroup.add(floor);

  // Whale body
  const bodyGroup = new THREE.Group();

  // Main body
  const bodyGeo = new THREE.SphereGeometry(1.2, 32, 24);
  bodyGeo.scale(2.2, 1, 1.3);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x334466,
    roughness: 0.3,
    metalness: 0.4
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);

  // Lighter belly
  const bellyGeo = new THREE.SphereGeometry(1.0, 32, 24);
  bellyGeo.scale(2, 0.6, 1.1);
  const bellyMat = new THREE.MeshStandardMaterial({
    color: 0x8899bb,
    roughness: 0.4,
    metalness: 0.2
  });
  const belly = new THREE.Mesh(bellyGeo, bellyMat);
  belly.position.y = -0.35;
  bodyGroup.add(body, belly);

  // Head
  const headGeo = new THREE.SphereGeometry(0.6, 24, 18);
  headGeo.scale(1, 0.7, 0.9);
  const headMat = new THREE.MeshStandardMaterial({
    color: 0x2a3355,
    roughness: 0.3,
    metalness: 0.4
  });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(1.8, 0.1, 0);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.12, 12, 8);
  const eyeMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.1 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(2.1, 0.25, 0.35);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(2.1, 0.25, -0.35);
  const pupilGeo = new THREE.SphereGeometry(0.06, 8, 6);
  const pupilMat = new THREE.MeshStandardMaterial({ color:0x000000, roughness:0.1 });
  const lPupil = new THREE.Mesh(pupilGeo, pupilMat);
  lPupil.position.set(0.06, 0, 0);
  const rPupil = new THREE.Mesh(pupilGeo, pupilMat);
  rPupil.position.set(0.06, 0, 0);
  leftEye.add(lPupil);
  rightEye.add(rPupil);

  // Tail
  const tailGroup = new THREE.Group();
  tailGroup.position.set(-2.2, 0.3, 0);
  const tailGeo = new THREE.ConeGeometry(0.6, 1.8, 16, 8);
  tailGeo.scale(0.7, 1, 0.25);
  const tailMat = new THREE.MeshStandardMaterial({
    color: 0x445577,
    roughness: 0.3,
    metalness: 0.3
  });
  const tail = new THREE.Mesh(tailGeo, tailMat);
  tail.position.set(-0.6, 0, 0);
  tail.rotation.z = Math.PI/2;
  tailGroup.add(tail);

  // Flippers
  const flipperGeo = new THREE.ConeGeometry(0.4, 1.8, 12, 6);
  flipperGeo.scale(0.4, 0.6, 0.15);

  const lFlipper = new THREE.Mesh(flipperGeo, new THREE.MeshStandardMaterial({color:0x445577, roughness:0.3, metalness:0.3}));
  lFlipper.position.set(-0.5, -0.5, 0.7);
  lFlipper.rotation.set(0, 0, Math.PI*0.4);

  const rFlipper = new THREE.Mesh(flipperGeo, new THREE.MeshStandardMaterial({color:0x445577, roughness:0.3, metalness:0.3}));
  rFlipper.position.set(-0.5, -0.5, -0.7);
  rFlipper.rotation.set(0, 0, -Math.PI*0.4);

  bodyGroup.add(head, leftEye, rightEye, tailGroup, lFlipper, rFlipper);
  bodyGroup.position.set(0, 1.2, 0);
  organismGroup.add(bodyGroup);

  whaleParts = { bodyGroup, tailGroup, body, head, lFlipper, rFlipper, leftEye, rightEye };

  // Bubbles
  for(let i=0;i<20;i++) {
    const bGeo = new THREE.SphereGeometry(0.03+Math.random()*0.08, 8, 6);
    const bMat = new THREE.MeshStandardMaterial({
      color: 0x88aacc, roughness:0.1, metalness:0.1,
      transparent:true, opacity:0.6
    });
    const bubble = new THREE.Mesh(bGeo, bMat);
    bubble.position.set(
      (Math.random()-0.5)*8,
      Math.random()*4-1.5,
      (Math.random()-0.5)*8
    );
    bubble.userData = { speed: 0.003+Math.random()*0.01, offset: Math.random()*Math.PI*2 };
    organismGroup.add(bubble);
  }
}

function addWhalePulse() {
  messageCount++;
  // Spawn new bubbles near whale
  for(let i=0;i<3;i++) {
    const bGeo = new THREE.SphereGeometry(0.05+Math.random()*0.06, 8, 6);
    const bMat = new THREE.MeshStandardMaterial({
      color: 0x88aacc, roughness:0.1, metalness:0.1,
      transparent:true, opacity:0.7
    });
    const bubble = new THREE.Mesh(bGeo, bMat);
    bubble.position.set(
      (Math.random()-0.5)*2,
      1.2 + Math.random()*0.6,
      (Math.random()-0.5)*2
    );
    bubble.userData = { speed: 0.005+Math.random()*0.015, offset: Math.random()*Math.PI*2, life: 0 };
    organismGroup.add(bubble);
    leaves.push(bubble); // reuse leaves array for bubble tracking
  }
}

function clearOrganism() {
  while(organismGroup.children.length > 0) {
    organismGroup.remove(organismGroup.children[0]);
  }
  leaves = [];
  branches = [];
  whaleParts = {};
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.mode-btn').forEach(b => {
    if((mode==='tree' && b.textContent.includes('樹')) ||
       (mode==='whale' && b.textContent.includes('鯨'))) {
      b.classList.add('active');
    }
  });
  messageCount = 0;

  if(mode === 'tree') {
    createTree();
    // Shift camera
    camera.position.set(0, 2.5, 10);
    camera.lookAt(0, 1.2, 0);
  } else {
    createWhale();
    // Shift camera
    camera.position.set(0, 2, 11);
    camera.lookAt(0, 1.5, 0);
  }
}

function morphToMode(newMode) {
  // Scale down current, then rebuild
  const startTime = Date.now();
  const duration = 800;

  function animateMorph() {
    const elapsed = Date.now() - startTime;
    const t = Math.min(elapsed/duration, 1);
    const ease = 1 - Math.pow(1-t, 3);

    organismGroup.scale.setScalar(1 - ease*0.5);

    if(t < 0.5) {
      // shrinking phase
    } else if(t >= 0.5 && organismGroup.scale.x < 0.01) {
      switchMode(newMode);
      organismGroup.scale.setScalar(0.5);
    }

    if(t < 1) {
      requestAnimationFrame(animateMorph);
    } else {
      organismGroup.scale.setScalar(1);
    }
  }
  animateMorph();
}

// --- Animation ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = Date.now() * 0.001;

  if(currentMode === 'tree') {
    // Gentle sway
    organismGroup.children.forEach((child, i) => {
      if(child.type === 'Group' && child !== organismGroup) {
        child.rotation.z += Math.sin(time*1.5 + i)*0.0008;
      }
    });

    // Animate leaves growth
    leaves.forEach((leaf, i) => {
      if(leaf.userData.targetScale && leaf.scale.x < leaf.userData.targetScale) {
        const grow = Math.min(1, leaf.scale.x + 0.03);
        leaf.scale.setScalar(grow);
        if(grow >= leaf.userData.targetScale) {
          leaf.userData.targetScale = null;
        }
      }
      if(leaf.material && leaf.material.opacity < (leaf.userData.targetOpacity||0.8)) {
        leaf.material.opacity = Math.min(leaf.userData.targetOpacity||0.8, leaf.material.opacity + 0.02);
      }
    });

    // Rotate slowly
    organismGroup.rotation.y += 0.0015;
  }

  if(currentMode === 'whale') {
    const { bodyGroup, tailGroup, body, lFlipper, rFlipper } = whaleParts;
    if(bodyGroup) {
      // Swimming motion
      bodyGroup.position.y = 1.2 + Math.sin(time*0.8)*0.3;
      bodyGroup.position.x = Math.sin(time*0.5)*1.5;
      bodyGroup.rotation.z = Math.sin(time*0.8)*0.08;

      // Tail wag
      if(tailGroup) {
        tailGroup.rotation.y = Math.sin(time*3)*0.4;
      }

      // Flipper movement
      if(lFlipper) lFlipper.rotation.z = Math.PI*0.4 + Math.sin(time*2.5)*0.2;
      if(rFlipper) rFlipper.rotation.z = -Math.PI*0.4 + Math.sin(time*2.5+1)*0.2;
    }

    // Animate bubbles
    leaves.forEach(bubble => {
      if(bubble.userData.speed) {
        bubble.position.y += bubble.userData.speed;
        bubble.position.x += Math.sin(time*2 + bubble.userData.offset)*0.003;
        bubble.userData.life = (bubble.userData.life||0) + 0.01;
        if(bubble.position.y > 4) bubble.position.y = -2;
        if(bubble.userData.life > 1) {
          bubble.material.opacity = Math.max(0, 0.7 - (bubble.userData.life-1)*0.7);
        }
      }
    });

    organismGroup.rotation.y += 0.002;
  }

  // Rotate particles
  particles.rotation.y += 0.0003;
  particles.rotation.x += 0.0001;

  renderer.render(scene, camera);
}

// --- Chat ---
function send() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if(!text) return;

  const sentiment = simpleSentiment(text);
  updateSentimentDots(sentiment);

  // Add user message
  const msgDiv = document.getElementById('messages');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';
  userMsg.textContent = text;
  msgDiv.appendChild(userMsg);

  // Grow organism
  if(currentMode === 'tree') addTreeGrowth();
  else addWhalePulse();

  // Bot response
  setTimeout(() => {
    const responses = [
      '我感受到了你的情緒波動，看看我的形態如何回應。',
      '有趣的觀點——我的枝葉 / 聲波正在記錄這次對話。',
      '繼續說，每一句話都讓這個生態系統更加豐富。',
      '這段對話的能量讓我的形態產生了新的變化。',
      '我正在學習你的語言節奏，形態隨之調整。'
    ];
    const botMsg = document.createElement('div');
    botMsg.className = 'msg bot';
    botMsg.textContent = responses[Math.floor(Math.random()*responses.length)];
    msgDiv.appendChild(botMsg);
    msgDiv.scrollTop = msgDiv.scrollHeight;

    // Extra growth on response
    if(currentMode === 'tree') {
      for(let i=0;i<2;i++) growLeaf(branches[0]||branches[Math.floor(Math.random()*branches.length)], 0.5);
    }
  }, 800);

  input.value = '';
  msgDiv.scrollTop = msgDiv.scrollHeight;
}

// --- Init ---
initSentimentDots();
createTree();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Orbit controls (simple drag)
let isDragging = false;
let prevMouse = { x:0, y:0 };
container.addEventListener('mousedown', e => { isDragging=true; prevMouse={x:e.clientX, y:e.clientY}; });
window.addEventListener('mouseup', () => { isDragging=false; });
window.addEventListener('mousemove', e => {
  if(!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  organismGroup.rotation.y += dx * 0.005;
  camera.position.y += dy * 0.02;
  camera.position.y = Math.max(0.5, Math.min(6, camera.position.y));
  camera.lookAt(0, 1.2, 0);
  prevMouse = { x:e.clientX, y:e.clientY };
});

animate();

// Expose to global
window.switchMode = switchMode;
window.send = send;
</script>
