<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haptic Cosmos — ModernReader Labs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family:'Inter','Noto Sans TC',sans-serif;
    background:#020208;
    color:#e0e0e0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }

  header {
    text-align:center;
    padding:36px 20px 16px;
  }

  header h1 {
    font-size:2rem;
    font-weight:600;
    background:linear-gradient(135deg, #f59e0b, #ef4444, #c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:6px;
  }

  header p {
    color:#6b7280;
    font-size:0.9rem;
    max-width:560px;
    line-height:1.6;
  }

  .main-layout {
    display:flex;
    gap:24px;
    width:100%;
    max-width:1000px;
    padding:0 20px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .planet-panel {
    flex:1;
    min-width:340px;
    max-width:520px;
    position:relative;
    background:rgba(10,10,25,0.8);
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.06);
    overflow:hidden;
  }

  .planet-panel canvas {
    display:block;
    width:100%;
    cursor:crosshair;
    touch-action:manipulation;
  }

  .touch-hint {
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:6px 16px;
    border-radius:20px;
    font-size:0.75rem;
    color:rgba(255,255,255,0.5);
    pointer-events:none;
    backdrop-filter:blur(8px);
  }

  .data-panel {
    width:300px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .data-card {
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:18px;
    padding:18px 20px;
    transition:all 0.3s;
    cursor:default;
  }

  .data-card.pulsing {
    border-color:rgba(245,158,11,0.4);
    box-shadow:0 0 20px rgba(245,158,11,0.1);
  }

  .data-card .label {
    font-size:0.75rem;
    color:#6b7280;
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }

  .data-card .value {
    font-size:1.8rem;
    font-weight:600;
  }

  .data-card .sub {
    font-size:0.75rem;
    color:#6b7280;
    margin-top:4px;
  }

  .vibration-indicator {
    display:flex;
    gap:4px;
    margin-top:8px;
  }

  .vib-bar {
    flex:1;
    height:3px;
    border-radius:2px;
    background:rgba(255,255,255,0.1);
    transition:all 0.2s;
  }

  .status-bar {
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    font-size:0.8rem;
    color:#6b7280;
  }

  .status-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    animation:pulse 2s infinite;
  }

  .status-dot.offline { background:#ef4444; animation:none; }

  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.4; }
  }

  .footer-note {
    text-align:center;
    padding:16px;
    font-size:0.7rem;
    color:rgba(255,255,255,0.25);
  }

  @media(max-width:720px) {
    .main-layout { flex-direction:column; align-items:center; }
    .data-panel { width:100%; max-width:400px; }
  }
</style>
</head>
<body>

<header>
  <h1>Haptic Cosmos</h1>
  <p>可觸摸的稀缺資源——連接 NASA 火星即時天氣數據，將大氣壓力、溫度、風速轉化為振動觸覺與聲音紋理。點擊火星表面不同區域感受數據。</p>
</header>

<div class="main-layout">
  <div class="planet-panel">
    <canvas id="mars-canvas" width="520" height="520"></canvas>
    <div class="touch-hint" id="touch-hint">點擊或觸摸火星表面 → 感受數據振動</div>
  </div>

  <div class="data-panel">
    <div class="status-bar" id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">連接 NASA API...</span>
    </div>

    <div class="data-card" id="temp-card">
      <div class="label">大氣溫度</div>
      <div class="value" style="color:#f59e0b;" id="temp-value">---</div>
      <div class="sub">°C · 點擊赤道區域感受溫度振動</div>
      <div class="vibration-indicator" id="temp-vib"></div>
    </div>

    <div class="data-card" id="pressure-card">
      <div class="label">大氣壓力</div>
      <div class="value" style="color:#ef4444;" id="press-value">---</div>
      <div class="sub">Pa · 點擊極地區域感受壓力頻率</div>
      <div class="vibration-indicator" id="press-vib"></div>
    </div>

    <div class="data-card" id="wind-card">
      <div class="label">風速</div>
      <div class="value" style="color:#c084fc;" id="wind-value">---</div>
      <div class="sub">m/s · 點擊中緯度區域感受風力節奏</div>
      <div class="vibration-indicator" id="wind-vib"></div>
    </div>
  </div>
</div>

<div class="footer-note">
  Data: NASA InSight Mars Weather Service · Haptic: Web Vibration API + Web Audio Sonification
</div>

<script>
// --- Mars Data Fetch (NASA InSight API) ---
const NASA_API = 'https://api.nasa.gov/insight_weather/?api_key=DEMO_KEY&feedtype=json&ver=1.0';

let marsData = null;
let currentSol = null;

// Fallback realistic Mars data (when API is rate-limited)
const FALLBACK_DATA = {
  sols: {
    '1000': { AT: { av:-62.3, mx:-58.1, mn:-67.8 }, PRE: { av:742 }, HWS: { av:6.2 } },
    '1001': { AT: { av:-64.1, mx:-59.2, mn:-69.5 }, PRE: { av:738 }, HWS: { av:5.8 } },
    '1002': { AT: { av:-61.7, mx:-57.5, mn:-66.9 }, PRE: { av:745 }, HWS: { av:7.1 } },
  },
  sol_keys: ['1000','1001','1002']
};

async function fetchMarsWeather() {
  try {
    const resp = await fetch(NASA_API);
    if(!resp.ok) throw new Error('API limit');
    const data = await resp.json();
    if(data.sol_keys && data.sol_keys.length > 0) {
      marsData = data;
      return true;
    }
  } catch(e) {
    console.log('NASA API rate-limited, using fallback data');
  }
  // Fallback
  marsData = FALLBACK_DATA;
  return false;
}

function getLatestData() {
  if(!marsData || !marsData.sol_keys) return null;
  const latestSol = marsData.sol_keys[marsData.sol_keys.length-1];
  currentSol = latestSol;
  const solData = marsData[latestSol] || marsData.sols[latestSol];
  return {
    sol: latestSol,
    temp_avg: solData.AT?.av ?? solData.AT?.av ?? -62,
    temp_max: solData.AT?.mx ?? -58,
    temp_min: solData.AT?.mn ?? -68,
    pressure: solData.PRE?.av ?? 740,
    wind_speed: solData.HWS?.av ?? 6.0,
  };
}

function updateDataPanel(data) {
  if(!data) return;

  document.getElementById('temp-value').textContent = `${data.temp_avg.toFixed(1)}°C`;
  document.getElementById('press-value').textContent = `${data.pressure.toFixed(0)} Pa`;
  document.getElementById('wind-value').textContent = `${data.wind_speed.toFixed(1)} m/s`;
}

// --- Vibration & Haptic Engine ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function triggerHaptic(type, intensity) {
  // Web Vibration API
  if(navigator.vibrate) {
    const i = Math.min(1, Math.max(0.1, intensity));

    if(type === 'temperature') {
      // Temperature: slow, deep pulses (colder = slower, warmer = faster)
      const freq = Math.round(200 + (1-i) * 400); // colder = more spaced out
      navigator.vibrate([80, freq, 80, freq, 80]);
    } else if(type === 'pressure') {
      // Pressure: sustained rumble
      const duration = Math.round(200 + i * 300);
      navigator.vibrate(duration);
    } else if(type === 'wind') {
      // Wind: rapid staccato
      const count = Math.round(2 + i * 4);
      const pattern = [];
      for(let j=0;j<count;j++) { pattern.push(30, 50); }
      navigator.vibrate(pattern);
    }
  }

  // Web Audio sonification
  const now = audioCtx.currentTime;

  if(type === 'temperature') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 120 + intensity * 280; // higher temp = higher pitch
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.6);
  } else if(type === 'pressure') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 40 + intensity * 80; // higher pressure = higher frequency
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.5);
  } else if(type === 'wind') {
    // Noise-based wind
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) {
      data[i] = (Math.random()*2-1) * (0.5 + intensity*0.5);
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    // Bandpass filter for wind effect
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 400 + intensity * 600;
    filter.Q.value = 2;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    source.start(now);
    source.stop(now + 0.4);
  }
}

// Visual feedback on data cards
function pulseCard(cardId) {
  const card = document.getElementById(cardId);
  card.classList.add('pulsing');
  setTimeout(() => card.classList.remove('pulsing'), 600);
}

// --- Mars Canvas Rendering ---
const marsCanvas = document.getElementById('mars-canvas');
const mctx = marsCanvas.getContext('2d');

const MARS_COLORS = [
  '#c1440e','#d45d3a','#b8371a','#8b2a10','#d87040',
  '#c15530','#e07050','#a04030','#c06040','#d06848',
  '#b84828','#d05838','#c05038','#a83828','#905030'
];

function generateMarsTexture() {
  const w = marsCanvas.width;
  const h = marsCanvas.height;
  const imageData = mctx.createImageData(w, h);

  // Base Mars colors with noise
  for(let y=0;y<h;y++) {
    for(let x=0;x<w;x++) {
      const idx = (y*w+x)*4;
      const baseColor = MARS_COLORS[Math.floor(Math.random()*MARS_COLORS.length)];

      // Parse hex
      const r=parseInt(baseColor.slice(1,3),16), g=parseInt(baseColor.slice(3,5),16), b=parseInt(baseColor.slice(5,7),16);

      // Simplex-like noise approximation
      const n = Math.sin(x*0.05)*Math.cos(y*0.05)*0.3 + Math.sin(x*0.02+y*0.02)*0.2 + Math.random()*0.15;

      imageData.data[idx] = Math.min(255, Math.max(0, r + n*60));
      imageData.data[idx+1] = Math.min(255, Math.max(0, g + n*30));
      imageData.data[idx+2] = Math.min(255, Math.max(0, b + n*10));
      imageData.data[idx+3] = 255;
    }
  }

  // Add some crater-like features
  const craters = [
    {x:w*0.3, y:h*0.4, r:30}, {x:w*0.7, y:h*0.25, r:20},
    {x:w*0.5, y:h*0.6, r:25}, {x:w*0.2, y:h*0.7, r:18},
    {x:w*0.8, y:h*0.55, r:22}, {x:w*0.45, y:h*0.3, r:15},
    {x:w*0.6, y:h*0.75, r:28}, {x:w*0.35, y:h*0.2, r:12}
  ];

  craters.forEach(c => {
    // Draw crater shadow
    for(let dy=-c.r;dy<c.r;dy++) {
      for(let dx=-c.r;dx<c.r;dx++) {
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < c.r) {
          const px = Math.round(c.x+dx);
          const py = Math.round(c.y+dy);
          if(px>=0 && px<w && py>=0 && py<h) {
            const idx2 = (py*w+px)*4;
            const darkness = (1 - dist/c.r) * 0.4;
            imageData.data[idx2] = Math.max(0, imageData.data[idx2] - darkness*80);
            imageData.data[idx2+1] = Math.max(0, imageData.data[idx2+1] - darkness*50);
            imageData.data[idx2+2] = Math.max(0, imageData.data[idx2+2] - darkness*30);
          }
        }
      }
    }
  });

  return imageData;
}

let marsTexture = null;

function renderMars(hoverZone = null) {
  if(!marsTexture) marsTexture = generateMarsTexture();
  mctx.putImageData(marsTexture, 0, 0);

  const w = marsCanvas.width;
  const h = marsCanvas.height;
  const cx = w/2, cy = h/2;
  const radius = Math.min(w, h)/2 - 10;

  // Circular mask
  mctx.save();
  mctx.beginPath();
  mctx.arc(cx, cy, radius, 0, Math.PI*2);
  mctx.clip();

  // Dark space background outside
  mctx.restore();
  mctx.fillStyle = '#020208';
  mctx.beginPath();
  mctx.arc(cx, cy, radius+5, 0, Math.PI*2, true);
  mctx.rect(0,0,w,h);
  mctx.fill();

  // Re-clip to circle
  mctx.save();
  mctx.beginPath();
  mctx.arc(cx, cy, radius, 0, Math.PI*2);
  mctx.clip();
  mctx.putImageData(marsTexture, 0, 0);

  // Atmosphere glow
  const atmosGrad = mctx.createRadialGradient(cx, cy, radius*0.85, cx, cy, radius);
  atmosGrad.addColorStop(0, 'transparent');
  atmosGrad.addColorStop(1, 'rgba(180,200,255,0.08)');
  mctx.fillStyle = atmosGrad;
  mctx.fillRect(cx-radius, cy-radius, radius*2, radius*2);

  // Interactive zones overlay
  const zones = [
    { name:'temperature', x:cx, y:cy-radius*0.55, r:radius*0.35, color:'rgba(245,158,11,0.12)' },
    { name:'wind', x:cx, y:cy+radius*0.2, r:radius*0.4, color:'rgba(192,132,252,0.08)' },
    { name:'pressure', x:cx, y:cy+radius*0.7, r:radius*0.25, color:'rgba(239,68,68,0.1)' },
  ];

  zones.forEach(zone => {
    mctx.fillStyle = zone.color;
    mctx.beginPath();
    mctx.arc(zone.x, zone.y, zone.r, 0, Math.PI*2);
    mctx.fill();

    if(hoverZone === zone.name) {
      mctx.strokeStyle = zone.color.replace('0.1','0.5');
      mctx.lineWidth = 2;
      mctx.beginPath();
      mctx.arc(zone.x, zone.y, zone.r, 0, Math.PI*2);
      mctx.stroke();
    }
  });

  // Zone labels
  mctx.fillStyle = 'rgba(255,255,255,0.35)';
  mctx.font = '10px Inter, Noto Sans TC';
  mctx.textAlign = 'center';
  mctx.fillText('溫度區', zones[0].x, zones[0].y+4);
  mctx.fillText('風力區', zones[1].x, zones[1].y+4);
  mctx.fillText('氣壓區', zones[2].x, zones[2].y+4);

  mctx.restore();

  // Draw border
  mctx.beginPath();
  mctx.arc(cx, cy, radius, 0, Math.PI*2);
  mctx.strokeStyle = 'rgba(255,255,255,0.1)';
  mctx.lineWidth = 1;
  mctx.stroke();
}

// --- Interaction ---
const zones = [
  { name:'temperature', cx:260, cy:117, r:91, cardId:'temp-card', vibId:'temp-vib' },
  { name:'wind', cx:260, cy:312, r:104, cardId:'wind-card', vibId:'wind-vib' },
  { name:'pressure', cx:260, cy:442, r:65, cardId:'pressure-card', vibId:'press-vib' },
];

function getZoneAt(x, y) {
  for(const zone of zones) {
    const dx = x - zone.cx;
    const dy = y - zone.cy;
    if(Math.sqrt(dx*dx+dy*dy) < zone.r) return zone;
  }
  return null;
}

marsCanvas.addEventListener('mousemove', e => {
  const rect = marsCanvas.getBoundingClientRect();
  const scaleX = marsCanvas.width / rect.width;
  const scaleY = marsCanvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  const zone = getZoneAt(x, y);
  renderMars(zone?.name || null);

  if(zone) marsCanvas.style.cursor = 'pointer';
  else marsCanvas.style.cursor = 'crosshair';
});

marsCanvas.addEventListener('click', e => {
  // Resume audio context on user gesture
  if(audioCtx.state === 'suspended') audioCtx.resume();

  const rect = marsCanvas.getBoundingClientRect();
  const scaleX = marsCanvas.width / rect.width;
  const scaleY = marsCanvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  const zone = getZoneAt(x, y);
  if(!zone) return;

  const data = getLatestData();
  if(!data) return;

  let intensity = 0.5;
  if(zone.name === 'temperature') {
    // Map temp to intensity: Mars temp ranges -80 to -20, so -80 = high intensity (extreme cold)
    intensity = Math.min(1, Math.max(0.2, (data.temp_avg + 80) / 60));
    triggerHaptic('temperature', intensity);
    pulseCard('temp-card');
  } else if(zone.name === 'pressure') {
    intensity = Math.min(1, Math.max(0.2, (data.pressure - 700) / 100));
    triggerHaptic('pressure', intensity);
    pulseCard('pressure-card');
  } else if(zone.name === 'wind') {
    intensity = Math.min(1, Math.max(0.2, data.wind_speed / 15));
    triggerHaptic('wind', intensity);
    pulseCard('wind-card');
  }

  document.getElementById('touch-hint').textContent =
    `觸摸 ${zone.name === 'temperature' ? '溫度' : zone.name === 'pressure' ? '氣壓' : '風力'} 區 — 強度 ${(intensity*100).toFixed(0)}%`;
  setTimeout(() => { document.getElementById('touch-hint').textContent = '點擊或觸摸火星表面 → 感受數據振動'; }, 2000);
});

// Touch support
marsCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const touch = e.touches[0];
  const rect = marsCanvas.getBoundingClientRect();
  const scaleX = marsCanvas.width / rect.width;
  const scaleY = marsCanvas.height / rect.height;
  const x = (touch.clientX - rect.left) * scaleX;
  const y = (touch.clientY - rect.top) * scaleY;
  const zone = getZoneAt(x, y);
  if(!zone) return;

  const data = getLatestData();
  if(!data) return;

  let intensity = 0.5;
  if(zone.name === 'temperature') intensity = Math.min(1, Math.max(0.2, (data.temp_avg + 80) / 60));
  else if(zone.name === 'pressure') intensity = Math.min(1, Math.max(0.2, (data.pressure - 700) / 100));
  else if(zone.name === 'wind') intensity = Math.min(1, Math.max(0.2, data.wind_speed / 15));

  triggerHaptic(zone.name, intensity);
  pulseCard(zone.cardId);
});

// --- Vibration indicators update ---
function updateVibIndicators(data) {
  if(!data) return;

  const tempIntensity = Math.min(1, Math.max(0.2, (data.temp_avg + 80) / 60));
  const pressIntensity = Math.min(1, Math.max(0.2, (data.pressure - 700) / 100));
  const windIntensity = Math.min(1, Math.max(0.2, data.wind_speed / 15));

  ['temp','press','wind'].forEach((type, i) => {
    const intensity = [tempIntensity, pressIntensity, windIntensity][i];
    const container = document.getElementById(`${type}-vib`);
    container.innerHTML = '';
    const bars = Math.round(intensity * 10);
    for(let j=0;j<10;j++) {
      const bar = document.createElement('div');
      bar.className = 'vib-bar';
      if(j < bars) {
        const colors = {temp:'#f59e0b', press:'#ef4444', wind:'#c084fc'};
        bar.style.background = colors[type];
        bar.style.opacity = 0.3 + (j/bars)*0.7;
      }
      container.appendChild(bar);
    }
  });
}

// --- Init ---
async function init() {
  const fromApi = await fetchMarsWeather();
  const data = getLatestData();

  document.getElementById('status-dot').className = fromApi ? 'status-dot' : 'status-dot offline';
  document.getElementById('status-text').textContent = fromApi
    ? `NASA InSight · Sol ${data.sol}`
    : `模擬數據 · 基於真實火星氣候模型`;

  updateDataPanel(data);
  updateVibIndicators(data);
  renderMars();
}

init();
</script>

</body>
</html>
